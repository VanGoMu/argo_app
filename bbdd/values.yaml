namespace: ddbb
postgresql:
    
  # Configuración de autenticación
  auth:
    enablePostgresUser: true
    postgresPassword: mysecretpassword
    username: appuser
    password: apppassword
    database: appdb
    
  # Configuración de arquitectura (StatefulSet automático)
  architecture: standalone
  
  # Configuración del primary (StatefulSet)
  primary:
    # Configuración de persistencia (PVC automático)
    persistence:
      enabled: true
      size: 15Gi
      storageClass: "nfs-storage"
      accessModes:
        - ReadWriteOnce
    
    # Recursos del pod
    resources:
      requests:
        memory: "256Mi"
        cpu: "250m"
      limits:
        memory: "512Mi"
        cpu: "500m"
    
    # Configuración del servicio
    service:
      type: ClusterIP
      ports:
        postgresql: 5432
    
    # Configuración PostgreSQL personalizada
    extendedConfiguration: |
      max_connections = 200
      shared_buffers = 128MB
      effective_cache_size = 256MB
      
    # Scripts de inicialización
    initdb:
      scripts:
        01-init.sql: |
          CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
          CREATE SCHEMA IF NOT EXISTS app_schema;
          GRANT ALL PRIVILEGES ON SCHEMA app_schema TO appuser;

  # Configuración de métricas (opcional)
  metrics:
    enabled: true
    service:
      type: ClusterIP
      ports:
        metrics: 9187

# Configuración global
global:
  postgresql:
    auth:
      username: appuser
      password: apppassword
      database: appdb
