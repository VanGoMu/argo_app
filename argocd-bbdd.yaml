---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgresql-bbdd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/VanGoMu/argo_app.git
    targetRevision: HEAD
    path: bbdd
  destination:
    server: https://kubernetes.default.svc
    namespace: ddbb
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
  revisionHistoryLimit: 3
