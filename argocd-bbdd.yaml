---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres-db
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    targetRevision: 0.20.0
    helm:
      values: |
        cluster:
          instances: 1
          postgresql:
            parameters:
              max_connections: "100"
              shared_buffers: "128MB"
          
          storage:
            size: 10Gi
            storageClass: "nfs-storage"
          
          monitoring:
            enabled: true
          
          bootstrap:
            initdb:
              database: appdb
              owner: appuser
              secret:
                name: postgres-credentials

  destination:
    server: https://kubernetes.default.svc
    namespace: postgres-db

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: postgres-credentials
      jsonPointers:
        - /data